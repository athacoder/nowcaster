[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nowcaster"
version = "0.1.0"
description = "Nowcast India's monthly food CPI before the official release"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Atharva Shahagadkar" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "scipy-stubs"]

[project.scripts]
nowcaster = "nowcaster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcaster"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
